packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  core-js-pure: true
  esbuild: true
  vue-demi: true

minimumReleaseAge: 0

# Dependencies deliberately held back, also for transitive resolutions.
overrides:
  # TypeScript 7 is the native (Go) compiler: it dropped the classic compiler
  # API that vue-tsc, ts-node and typescript-eslint still rely on.
  # Revisit once Volar and typescript-eslint ship native support.
  typescript: ^6.0.3

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js-pure
  - esbuild
  - unrs-resolver
  - vue-demi
