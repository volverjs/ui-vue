packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  core-js-pure: true
  esbuild: true
  vue-demi: true

minimumReleaseAge: 0

# Dependencies deliberately held back, also for transitive resolutions.
overrides:
  # TypeScript 7 is the native (Go) compiler: it dropped the classic compiler
  # API that vue-tsc, ts-node and typescript-eslint still rely on.
  # Revisit once Volar and typescript-eslint ship native support.
  typescript: ^6.0.3

  # Advisories in transitive development dependencies, none of them reachable
  # from the published package. Their parents (storybook, @antfu/eslint-config,
  # @vue/test-utils, @iconify/tools) still resolve the vulnerable versions, so
  # the fixed ones are pulled up from here. Each entry is the patched range from
  # the advisory, kept per major where more than one is installed. Drop an entry
  # once its parent resolves a fixed version on its own.
  # The direct dependency is on 8, the advisory hits a transitive 7
  '@babel/core@7': ^7.29.1
  'brace-expansion@1': ^1.1.17
  'brace-expansion@2': ^2.1.3
  'brace-expansion@5': ^5.0.8
  esbuild: ^0.28.1
  flatted: ^3.4.2
  immutable: ^5.1.8
  js-cookie: ^3.0.6
  lodash: ^4.17.24
  'picomatch@2': ^2.3.2
  'picomatch@4': ^4.0.4
  svgo: ^4.0.2
  trim: ^0.0.3
  ws: ^8.21.0

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js-pure
  - esbuild
  - unrs-resolver
  - vue-demi
