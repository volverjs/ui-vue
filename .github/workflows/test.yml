name: Run library test

on:
    workflow_call:

jobs:
    storybook:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            # v6.1.0 is the first release that bootstraps pnpm 12, which
            # ships as a native binary instead of the `@pnpm/exe` package
            # the older path expects. The floating `v6` tag still points at
            # v6.0.10, so the version has to be pinned until the tag moves.
            # Pinned by commit and not by tag: a tag can be moved, and the
            # analysis rates a third party action referenced by tag as a
            # supply chain risk.
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Use Node.js 24
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run Storybook tests
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
              run: pnpm test-storybook
