name: Test library

on:
    workflow_call:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            # v6.1.0 is the first release that bootstraps pnpm 12, which
            # ships as a native binary instead of the `@pnpm/exe` package
            # the older path expects. The floating `v6` tag still points at
            # v6.0.10, so the version has to be pinned until the tag moves.
            - uses: pnpm/action-setup@v6.1.0

            - name: Use Node.js 24
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # `npm pkg set` instead of `pnpm version`, which refuses to run on an
            # unclean working tree: see the same step in build.yml
            - name: Bump version with release tag name
              if: ${{ github.event_name == 'release' }}
              env:
                  TAG_NAME: ${{ github.event.release.tag_name }}
              run: npm pkg set version="${TAG_NAME#v}"

            - name: Build styleguide
              env:
                  NODE_OPTIONS: '--max_old_space_size=4096'
              run: pnpm styleguide

            - name: Setup GitHub Pages
              uses: actions/configure-pages@v6

            # v4 pins actions/upload-artifact 4.6.2 internally, which still
            # targets Node.js 20 and makes every run of this job warn about the
            # deprecation. v5 is the same composite action with the pin moved to
            # upload-artifact 7, so it runs on Node.js 24. Same inputs.
            - name: Upload styleguide
              uses: actions/upload-pages-artifact@v5
              with:
                  name: 'github-pages'
                  path: './storybook-static'
